<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#000000" flood-opacity="0.07"/>
    </filter>

    <style>
      /* ---------- master loop = 12s ---------- */
      #dynamic { animation: dynFade 12s linear infinite; }
      @keyframes dynFade { 0%{opacity:0} 3%{opacity:1} 96%{opacity:1} 99.5%{opacity:0} 100%{opacity:0} }

      #promptText { animation: pIn 12s linear infinite; }
      @keyframes pIn { 0%{opacity:0} 4%{opacity:0} 9%{opacity:1} 93%{opacity:1} 98%{opacity:0} 100%{opacity:0} }

      #caret { animation: caretBlink 1s steps(1,end) infinite; }
      @keyframes caretBlink { 0%,49%{opacity:1} 50%,100%{opacity:0} }

      #promptGlow { animation: glow 12s linear infinite; }
      @keyframes glow { 0%{opacity:0} 6%{opacity:0} 9%{opacity:.85} 16%{opacity:0} 100%{opacity:0} }

      #pulseQ { animation: pq 12s linear infinite; }
      @keyframes pq {
        0%{opacity:0; transform:translateX(0)}
        13%{opacity:0; transform:translateX(0)}
        14%{opacity:1; transform:translateX(0)}
        20%{opacity:1; transform:translateX(59px)}
        21%{opacity:0; transform:translateX(59px)}
        100%{opacity:0; transform:translateX(59px)}
      }

      #memGroup { animation: memEnv 12s linear infinite; }
      @keyframes memEnv { 0%{opacity:.6} 20%{opacity:.6} 26%{opacity:1} 88%{opacity:1} 95%{opacity:.6} 100%{opacity:.6} }

      .node { fill:#4C5FD5; animation: tw 3.4s ease-in-out infinite; }
      @keyframes tw { 0%,100%{opacity:.42} 50%{opacity:.95} }

      .ripple { transform-box: fill-box; transform-origin: center; }
      #rip1 { animation: rippleA 12s linear infinite; }
      @keyframes rippleA {
        0%{transform:scale(0);opacity:0}
        22%{transform:scale(0);opacity:0}
        24%{transform:scale(0);opacity:.6; animation-timing-function:ease-out}
        42%{transform:scale(46);opacity:0}
        100%{transform:scale(46);opacity:0}
      }
      #rip2 { animation: rippleB 12s linear infinite; }
      @keyframes rippleB {
        0%{transform:scale(0);opacity:0}
        30%{transform:scale(0);opacity:0}
        32%{transform:scale(0);opacity:.5; animation-timing-function:ease-out}
        50%{transform:scale(46);opacity:0}
        100%{transform:scale(46);opacity:0}
      }

      .fp { fill:#4C5FD5; }
      #fp1{animation:fp1 12s linear infinite}
      #fp2{animation:fp2 12s linear infinite}
      #fp3{animation:fp3 12s linear infinite}
      #fp4{animation:fp4 12s linear infinite}
      #fp5{animation:fp5 12s linear infinite}
      @keyframes fp1{0%{opacity:0;transform:translate(0,0)}25%{opacity:0;transform:translate(0,0)}26%{opacity:1}33%{opacity:1;transform:translate(65px,-30px)}34%{opacity:0;transform:translate(65px,-30px)}100%{opacity:0;transform:translate(65px,-30px)}}
      @keyframes fp2{0%{opacity:0;transform:translate(0,0)}29%{opacity:0;transform:translate(0,0)}30%{opacity:1}37%{opacity:1;transform:translate(65px,8px)}38%{opacity:0;transform:translate(65px,8px)}100%{opacity:0;transform:translate(65px,8px)}}
      @keyframes fp3{0%{opacity:0;transform:translate(0,0)}33%{opacity:0;transform:translate(0,0)}34%{opacity:1}41%{opacity:1;transform:translate(65px,45px)}42%{opacity:0;transform:translate(65px,45px)}100%{opacity:0;transform:translate(65px,45px)}}
      @keyframes fp4{0%{opacity:0;transform:translate(0,0)}27%{opacity:0;transform:translate(0,0)}28%{opacity:1}35%{opacity:1;transform:translate(65px,-10px)}36%{opacity:0;transform:translate(65px,-10px)}100%{opacity:0;transform:translate(65px,-10px)}}
      @keyframes fp5{0%{opacity:0;transform:translate(0,0)}37%{opacity:0;transform:translate(0,0)}38%{opacity:1}44%{opacity:1;transform:translate(65px,25px)}45%{opacity:0;transform:translate(65px,25px)}100%{opacity:0;transform:translate(65px,25px)}}

      .bar { transform-box: fill-box; transform-origin: left center; }
      #barA{animation:fillA 12s linear infinite}
      #barB{animation:fillB 12s linear infinite}
      #barC{animation:fillC 12s linear infinite}
      #barD{animation:fillD 12s linear infinite}
      @keyframes fillA{0%{transform:scaleX(0)}26%{transform:scaleX(0);animation-timing-function:cubic-bezier(.2,.7,.3,1)}45%{transform:scaleX(.66)}99%{transform:scaleX(.66)}100%{transform:scaleX(0)}}
      @keyframes fillB{0%{transform:scaleX(0)}29%{transform:scaleX(0);animation-timing-function:cubic-bezier(.2,.7,.3,1)}48%{transform:scaleX(.50)}99%{transform:scaleX(.50)}100%{transform:scaleX(0)}}
      @keyframes fillC{0%{transform:scaleX(0)}25%{transform:scaleX(0);animation-timing-function:cubic-bezier(.2,.7,.3,1)}45%{transform:scaleX(.92)}99%{transform:scaleX(.92)}100%{transform:scaleX(0)}}
      @keyframes fillD{0%{transform:scaleX(0)}31%{transform:scaleX(0);animation-timing-function:cubic-bezier(.2,.7,.3,1)}50%{transform:scaleX(.38)}99%{transform:scaleX(.38)}100%{transform:scaleX(0)}}

      #chipA{animation:moveA 12s linear infinite}
      #chipB{animation:moveB 12s linear infinite}
      #chipC{animation:moveC 12s linear infinite}
      @keyframes moveA{0%{transform:translateY(0)}56%{transform:translateY(0);animation-timing-function:cubic-bezier(.6,0,.3,1)}68%{transform:translateY(68px)}99%{transform:translateY(68px)}100%{transform:translateY(0)}}
      @keyframes moveB{0%{transform:translateY(0)}56%{transform:translateY(0);animation-timing-function:cubic-bezier(.6,0,.3,1)}68%{transform:translateY(68px)}99%{transform:translateY(68px)}100%{transform:translateY(0)}}
      @keyframes moveC{0%{transform:translateY(0)}56%{transform:translateY(0);animation-timing-function:cubic-bezier(.6,0,.3,1)}68%{transform:translateY(-136px)}99%{transform:translateY(-136px)}100%{transform:translateY(0)}}

      .win{animation:win 12s linear infinite}
      @keyframes win{0%{opacity:0}66%{opacity:0}72%{opacity:1}99%{opacity:1}100%{opacity:0}}

      .lbl{ fill:#9A9A92; font-size:11px; letter-spacing:2px; font-weight:600; }
      .sub{ fill:#A6A69E; font-size:10.5px; font-style:italic; }
      .nm { fill:#2C2C2C; font-size:13px; font-weight:600; }
    </style>
  </defs>

  <!-- panel -->
  <rect x="6" y="6" width="808" height="456" rx="18" fill="#FBFBF9" stroke="#E7E7E1" stroke-width="1.5"/>

  <!-- header -->
  <text x="32" y="40" fill="#B5B4AC" font-size="10.5px" letter-spacing="2.5px" font-weight="600">GENERATIVE SELF-RETRIEVAL</text>
  <text x="788" y="40" text-anchor="end" fill="#C4C3BB" font-size="9.5px" letter-spacing="0.4px">a ranking loop inside the model</text>
  <line x1="32" y1="54" x2="788" y2="54" stroke="#EEEEE7" stroke-width="1"/>

  <!-- stage labels (static) -->
  <text x="111" y="98" text-anchor="middle" class="lbl">PROMPT</text>
  <text x="360" y="98" text-anchor="middle" class="lbl">PARAMETRIC MEMORY</text>
  <text x="656" y="98" text-anchor="middle" class="lbl">CANDIDATES</text>
  <text x="360" y="400" text-anchor="middle" class="sub">self-retrieval</text>
  <text x="656" y="400" text-anchor="middle" class="sub">ranked by recalled evidence</text>

  <!-- connectors -->
  <line x1="191" y1="253" x2="244" y2="253" stroke="#CFCEC6" stroke-width="1.4" stroke-dasharray="2 4"/>
  <path d="M250,253 L242,249 L242,257 Z" fill="#C9C8C0"/>
  <line x1="465" y1="253" x2="514" y2="253" stroke="#CFCEC6" stroke-width="1.4" stroke-dasharray="2 4"/>
  <path d="M520,253 L512,249 L512,257 Z" fill="#C9C8C0"/>

  <!-- prompt box -->
  <rect x="31" y="205" width="160" height="96" rx="10" fill="#FFFFFF" stroke="#DBDAD2" stroke-width="1.2" filter="url(#softShadow)"/>
  <rect id="promptGlow" x="31" y="205" width="160" height="96" rx="10" fill="none" stroke="#4C5FD5" stroke-width="2" opacity="0"/>
  <text x="43" y="226" fill="#A6A69E" font-size="10px" letter-spacing="0.6px">you ask</text>
  <g id="promptText">
    <text x="43" y="250" class="nm" font-size="12.5px">best CRM for</text>
    <text x="43" y="268" class="nm" font-size="12.5px">a two-person</text>
    <text x="43" y="286" class="nm" font-size="12.5px">startup</text>
    <rect id="caret" x="92" y="276" width="1.6" height="12" fill="#4C5FD5"/>
  </g>

  <!-- memory cloud -->
  <g id="memGroup">
    <!-- edges -->
    <g stroke="#D9D8D0" stroke-width="1">
      <line x1="300" y1="160" x2="345" y2="150"/>
      <line x1="345" y1="150" x2="395" y2="170"/>
      <line x1="395" y1="170" x2="430" y2="200"/>
      <line x1="430" y1="200" x2="410" y2="245"/>
      <line x1="410" y1="245" x2="360" y2="235"/>
      <line x1="360" y1="235" x2="315" y2="220"/>
      <line x1="315" y1="220" x2="280" y2="250"/>
      <line x1="280" y1="250" x2="330" y2="265"/>
      <line x1="330" y1="265" x2="360" y2="235"/>
      <line x1="360" y1="235" x2="380" y2="265"/>
      <line x1="380" y1="265" x2="410" y2="245"/>
      <line x1="330" y1="265" x2="300" y2="300"/>
      <line x1="300" y1="300" x2="350" y2="310"/>
      <line x1="350" y1="310" x2="380" y2="265"/>
      <line x1="350" y1="310" x2="400" y2="300"/>
      <line x1="400" y1="300" x2="435" y2="290"/>
      <line x1="435" y1="290" x2="410" y2="245"/>
    </g>
    <!-- ripples (spreading activation) -->
    <circle id="rip1" class="ripple" cx="358" cy="245" r="2" fill="none" stroke="#4C5FD5" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
    <circle id="rip2" class="ripple" cx="358" cy="245" r="2" fill="none" stroke="#4C5FD5" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
    <!-- nodes -->
    <circle class="node" cx="300" cy="160" r="6" style="animation-delay:-0.2s"/>
    <circle class="node" cx="345" cy="150" r="5" style="animation-delay:-1.1s"/>
    <circle class="node" cx="395" cy="170" r="6" style="animation-delay:-2.0s"/>
    <circle class="node" cx="430" cy="200" r="5" style="animation-delay:-0.6s"/>
    <circle class="node" cx="410" cy="245" r="7" style="animation-delay:-1.6s"/>
    <circle class="node" cx="360" cy="235" r="6" style="animation-delay:-0.9s"/>
    <circle class="node" cx="315" cy="220" r="5" style="animation-delay:-2.4s"/>
    <circle class="node" cx="280" cy="250" r="6" style="animation-delay:-0.3s"/>
    <circle class="node" cx="300" cy="300" r="5" style="animation-delay:-1.9s"/>
    <circle class="node" cx="350" cy="310" r="7" style="animation-delay:-1.2s"/>
    <circle class="node" cx="400" cy="300" r="6" style="animation-delay:-0.5s"/>
    <circle class="node" cx="435" cy="290" r="5" style="animation-delay:-2.7s"/>
    <circle class="node" cx="330" cy="265" r="5" style="animation-delay:-1.4s"/>
    <circle class="node" cx="380" cy="265" r="6" style="animation-delay:-0.8s"/>
  </g>

  <!-- prompt -> memory pulse -->
  <circle id="pulseQ" cx="191" cy="253" r="4" fill="#4C5FD5"/>

  <!-- candidate chips -->
  <g id="dynamic">
    <!-- Chip A : slot0 -->
    <g id="chipA" class="chip">
      <rect x="528" y="118" width="248" height="50" rx="9" fill="#FFFFFF" stroke="#DBDAD2" stroke-width="1.2" filter="url(#softShadow)"/>
      <text x="544" y="148" class="nm">Brand A</text>
      <rect x="620" y="134" width="132" height="13" rx="6.5" fill="#EEEEE8"/>
      <rect id="barA" class="bar" x="620" y="134" width="132" height="13" rx="6.5" fill="#4C5FD5"/>
    </g>
    <!-- Chip B : slot1 -->
    <g id="chipB" class="chip">
      <rect x="528" y="186" width="248" height="50" rx="9" fill="#FFFFFF" stroke="#DBDAD2" stroke-width="1.2" filter="url(#softShadow)"/>
      <text x="544" y="216" class="nm">Brand B</text>
      <rect x="620" y="202" width="132" height="13" rx="6.5" fill="#EEEEE8"/>
      <rect id="barB" class="bar" x="620" y="202" width="132" height="13" rx="6.5" fill="#4C5FD5"/>
    </g>
    <!-- Chip D : slot3 (static) -->
    <g id="chipD" class="chip">
      <rect x="528" y="322" width="248" height="50" rx="9" fill="#FFFFFF" stroke="#DBDAD2" stroke-width="1.2" filter="url(#softShadow)"/>
      <text x="544" y="352" class="nm">Brand D</text>
      <rect x="620" y="338" width="132" height="13" rx="6.5" fill="#EEEEE8"/>
      <rect id="barD" class="bar" x="620" y="338" width="132" height="13" rx="6.5" fill="#4C5FD5"/>
    </g>
    <!-- Chip C : slot2 -> rises to top (winner) -->
    <g id="chipC" class="chip">
      <rect x="528" y="254" width="248" height="50" rx="9" fill="#FFFFFF" stroke="#DBDAD2" stroke-width="1.2" filter="url(#softShadow)"/>
      <rect class="win" x="524" y="251" width="256" height="56" rx="12" fill="none" stroke="#D9952A" stroke-width="2.4" opacity="0"/>
      <text x="544" y="284" class="nm">Brand C</text>
      <rect x="620" y="270" width="132" height="13" rx="6.5" fill="#EEEEE8"/>
      <rect id="barC" class="bar" x="620" y="270" width="132" height="13" rx="6.5" fill="#4C5FD5"/>
      <rect class="win bar" x="620" y="270" width="132" height="13" rx="6.5" fill="#D9952A" opacity="0" style="transform:scaleX(.92)"/>
      <rect class="win" x="540" y="245" width="74" height="18" rx="9" fill="#D9952A" opacity="0"/>
      <text class="win" x="577" y="257.5" text-anchor="middle" fill="#FFFFFF" font-size="9.5px" letter-spacing="1.5px" font-weight="700" opacity="0">ANSWER</text>
    </g>
  </g>

  <!-- recalled facts flowing memory -> candidates -->
  <circle id="fp1" class="fp" cx="455" cy="245" r="3.5"/>
  <circle id="fp2" class="fp" cx="455" cy="245" r="3.5"/>
  <circle id="fp3" class="fp" cx="455" cy="245" r="3.5"/>
  <circle id="fp4" class="fp" cx="455" cy="245" r="3.5"/>
  <circle id="fp5" class="fp" cx="455" cy="245" r="3.5"/>

  <!-- caption -->
  <text x="410" y="442" text-anchor="middle" fill="#8E8E86" font-size="11.5px">The model recalls related facts from its own memory, weighs the candidates they support, and the top of that ranking becomes the answer.</text>
</svg>
